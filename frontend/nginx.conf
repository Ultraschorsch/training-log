server {
    listen 80;

    location /api/ {
        proxy_pass         http://training-backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }
}
